name: CI

# Проверка на каждый push в main и на каждый pull request:
#   1) тесты SwiftPM-пакета (чистая логика, без Xcode) — один раз;
#   2) генерация проекта XcodeGen и сборка приложения + расширения
#      без подписи, ОТДЕЛЬНО под каждую архитектуру (arm64 и x86_64).
#
# Раннер — macos-26 (Tahoe): это родная ОС для иконок Icon Composer
# (App/qlcode.icon). На macos-15 (Sequoia) их растеризация в сборке
# крашила actool — там нет системных сервисов иконок Tahoe. На Tahoe
# иконка собирается штатно, без обхода.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Выбрать Xcode 26 и показать версию
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Swift package tests
        run: swift test

  build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Выбрать Xcode 26 и показать версию
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Обязательный первый шаг: .xcodeproj в репозитории нет (артефакт XcodeGen).
      - name: Generate Xcode project
        run: xcodegen generate

      # Отдельная сборка под одну архитектуру, без подписи (проверка компиляции).
      # Иконку Icon Composer НЕ исключаем — на macos-26 она собирается штатно.
      - name: Build app + extension (unsigned, ${{ matrix.arch }})
        run: |
          set -euo pipefail
          xcodebuild build \
            -project QuickLookers.xcodeproj \
            -scheme QuickLookers \
            -destination 'generic/platform=macOS' \
            ARCHS="$ARCH" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
