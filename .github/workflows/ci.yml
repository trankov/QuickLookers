name: CI

# Проверка на каждый push в main и на каждый pull request:
#   1) тесты SwiftPM-пакета (чистая логика, без Xcode) — один раз;
#   2) генерация проекта XcodeGen и сборка приложения + расширения
#      без подписи, ОТДЕЛЬНО под каждую архитектуру (arm64 и x86_64).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Swift package tests
        run: swift test

  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      # Проект рассчитан на Xcode 26; если он есть на образе runner-а —
      # можно закрепить `xcode-version: '26.0'`. latest-stable берёт самый
      # свежий стабильный из доступных.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      # Обязательный первый шаг: .xcodeproj в репозитории нет (артефакт XcodeGen).
      - name: Generate Xcode project
        run: xcodegen generate

      # Отдельная сборка под одну архитектуру, без подписи (проверка компиляции).
      # Иконку Icon Composer (App/qlcode.icon) исключаем: actool крашится на ней
      # в безголовом runner-е (AssetCatalogAgent недоступен). На проверку кода
      # это не влияет; иконка компилируется локально в Xcode.
      - name: Build app + extension (unsigned, ${{ matrix.arch }})
        run: |
          xcodebuild build \
            -project QuickLookers.xcodeproj \
            -scheme QuickLookers \
            -destination 'generic/platform=macOS' \
            ARCHS="$ARCH" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            EXCLUDED_SOURCE_FILE_NAMES='*.icon' \
            ASSETCATALOG_COMPILER_APPICON_NAME=''
