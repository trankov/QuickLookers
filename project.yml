name: QuickLookers
options:
  deploymentTarget:
    macOS: "13.0"
  bundleIdPrefix: com.quicklookers

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # Xcode 16+ собирает Debug через стуб-загрузчик (debug dylib). Для
    # app-расширения это ломает загрузку провайдера: бандл виден в настройках,
    # но QuickLook не может его поднять и откатывается к дефолту. Выключаем.
    ENABLE_DEBUG_DYLIB: NO
    # Впиши сюда свой Team ID (Xcode → Settings → Accounts → твой аккаунт → Team ID).
    # Для ручного запуска в Finder подпись обязательна; для xcodebuild-проверки
    # компиляции подпись отключается флагом в команде (CODE_SIGNING_ALLOWED=NO).
    DEVELOPMENT_TEAM: "5FVC5YT2B5"

packages:
  QuickLookersEngine:
    path: .

# Общая схема хоста: запуск (⌘R) поднимает приложение QuickLookers и
# регистрирует встроенное расширение Preview у демона pkd. Без явной схемы
# Xcode автосоздаёт их сам, и активной может оказаться схема расширения —
# тогда на ⌘R он спрашивает «Choose an App to run» (расширение само не
# запускается). Закрепляем здесь, чтобы переживало xcodegen generate.
schemes:
  QuickLookers:
    build:
      targets:
        QuickLookers: all
        QuickLookersTests: [test]
    run:
      config: Debug
      executable: QuickLookers
    test:
      config: Debug
      targets:
        - QuickLookersTests

targets:
  QuickLookers:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quicklookers.QuickLookers
        GENERATE_INFOPLIST_FILE: NO   # был YES; нужен явный Info.plist для UTExportedTypeDeclarations
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # libarchive приходит транзитивно от CLibArchive.systemLibrary (link "archive"
        # в module.modulemap). Явный флаг — страховка на случай, если линкер Xcode
        # не подхватит транзитивную зависимость.
        OTHER_LDFLAGS: -larchive
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Один экспортируемый тип на ВСЕ СВОБОДНЫЕ (dyn.*) расширения (652 шт., пользователь
        # подтвердил полный список). Лист свободного расширения становится нашим (Спайк E).
        # Язык внутри берётся по расширению из associations.json — один UTI на много языков
        # норм (это маршрутизация, не семантика). Список ГЕНЕРИТСЯ:
        # `swift Scripts/audit-extension-utis.swift --emit-tags` (снимок в
        # docs/.../2026-07-03-extension-uti-audit.md, категория 1b). Руками не редактировать.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.quicklookers.source-code
            UTTypeDescription: Source code (QuickLookers)
            UTTypeConformsTo: [public.source-code, public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [4dform, 4dproject, 6pl, 6pm, _coffee, _emacs, _js, a51, abap, abbrev_defs, acl, ad, adml, admx, ado, adoc, adp, al, ant, apacheconf, apex, apl, apla, aplc, aplf, apli, apln, aplo, ara, asc, asciidoc, asd, asdf, asm, astro, auk, aux, avsc, aw, awk, axaml, axml, bal, bat, bats, bb, bbx, bdy, be, beancount, bib, bibtex, bicep, bicepparam, blade, bones, boot, bsl, builder, builds, cairo, cake, cask, cats, cbl, cblcpy, cblle, cblsrce, cbx, ccp, ccproj, ccxml, cdc, cdf, cgi, cginc, cjs, cjsx, cl2, clang-format, clar, clixml, clj, cljc, cljs, cljscm, cljx, cls, cmake, cmd, cnf, cob, cobcopy, cobol, code-snippets, code-workspace, coffee, conf, copybook, coq, cppm, cproject, cpy, cql, cr, cs, cscfg, csdef, cshtml, csl, csproj, csx, ct, ctp, cts, cue, cyp, cypher, d, dart, ddl, def, depproj, desktop, dfm, di, dita, ditamap, ditaval, dm, dme, dml, do, dockerfile, dof, doh, dotsettings, dpk, dpp, dpr, dtx, dump, dyalog, dyapp, edge, el, elc, eld, eliom, eliomi, elm, emacs, env, envvars, erb, erl, es, es6, escript, ex, eye, f03, f08, f18, fastcgi_params, fcgi, fd, feature, filters, fish, fmx, fnc, fnl, fp, fpp, frg, fshader, fsi, fsproj, fst, fsti, fsx, ftl, fx, fxh, fxml, gawk, gd, gdshader, gemspec, geo, gjs, glade, gleam, glslf, glslv, gml, gmx, gnu, gnuplot, gnus, go, god, gql, graphcool, graphql, graphqls, groovy, grt, grxml, gshader, gst, gtpl, gts, gvy, gyp, gypi, hack, haml, handlebars, har, hbs, hcl, hhi, hic, hjson, hlean, hlsli, hrl, hs, hs-boot, hsc, hsig, hta, htaccess, htgroups, htpasswd, http, hx, hxml, hxsl, hy, hzp, ice, iced, idc, ihlp, imba, imba2, iml, inc, ino, ins, ivy, ixx, j2, jade, jake, jbuilder, jelly, jinja, jinja2, jison, jl, jsb, jscad, jsfl, jsh, jslib, jsm, json5, jsonc, jsonl, jsonnet, jspre, jsproj, jss, jssm, jssm_state, jsx, kml, kojo, kql, kt, ktm, kts, kusto, launch, lbx, lean, lektorproject, less, lfm, libsonnet, linq, liquid, lisp, lks, lmi, lpr, lsp, ltx, lua, luau, ma, makefile, marko, mata, matah, mathematica, matlab, mawk, mcmeta, mdpolicy, mediawiki, mermaid, mipage, mips, mir, mjml, mkfile, mkii, mkiv, mkvi, ml, ml4, mli, mll, mly, mojo, move, mspec, mt, mxml, mysql, nas, natvis, nawk, nb, nbp, ncl, ndproj, nf, nginx, nginxconf, ngx, nim, nimble, nimrod, nims, nix, njs, nomad, nproj, nqp, nse, nu, nuspec, ny, odd, os, osm, p, p6, p6l, p6m, p8, pac, pascal, pck, pco, pcss, pd_lua, pdv, perl, ph, php5, phps, phpt, pkb, pkgproj, pkh, pks, pl6, plb, plot, plsql, plt, pluginspec, plx, pm6, po, podsl, podspec, polar, postcss, pq, pqm, prawn, prc, prefs, prisma, pro, proj, prolog, properties, props, ps1, ps1xml, psc1, psd1, psgi, psm1, pt, pug, purs, py3, pyde, pyi, pyp, pyt, pyw, qbs, qhelp, ql, qll, qml, query, rabl, rake, raku, rakumod, razor, rbi, rbuild, rbx, rbxs, rchit, rd, rdf, re, reek, reg, regex, regexp, res, rest, resx, rhtml, riscv, rkt, rktd, rktl, rmiss, rockspec, ronn, rpy, rq, rs, rst, rsx, ru, ruby, rviz, sarif, sas, sass, sbt, sc, scala, scb, scbl, scd, scgi_params, sch, scm, scrbl, scss, scxml, sdbl, sel, service, sexp, sfproj, sh-session, shader, shproj, sjs, sld, sls, sol, soy, spacemacs, sparql, spc, spec, spim, spl, splunk, sps, sq, sqlcblle, src, srdf, ss, ssh_config, sshd_config, ssjs, st, sthlp, story, sty, styl, stylus, sublime-build, sublime-color-scheme, sublime-commands, sublime-completions, sublime-keymap, sublime-macro, sublime-menu, sublime-mousemap, sublime-project, sublime-settings, sublime-snippet, sublime-syntax, sublime-theme, sublime-workspace, sublime_metrics, sublime_session, sv, svelte, svh, sw, syntax, t, tab, tac, talon, targets, tasl, tcc, tcl, templ, tesc, tese, tex, tf, tfstate, tfvars, thor, tm, tml, tmux, toc, topojson, tpb, tpp, tps, trg, trigger, tsp, ttl, turtle, twig, txx, typ, udf, ui, urdf, uwsgi_params, ux, v, vala, vapi, vb, vba, vbhtml, vbproj, vcxproj, veo, vh, vhd, vhdl, vhf, vhi, vho, vhost, vhs, vht, vhw, vim, vimrc, viper, viw, vmb, vrx, vshader, vsixmanifest, vssettings, vstemplate, vue, vv, vw, vxml, vy, wast, wat, watchr, webapp, webmanifest, wgsl, wiki, wikitext, wixproj, wks, wl, wls, wlt, wlua, workbook, workflow, wsdl, wsf, wsgi, wxi, wxl, wxs, x3d, xacro, xaml, xdc, xmi, xproj, xpy, xrl, xsd, xsjs, xsjslib, xsl, xslt, xspec, xul, yap, yasm, yrl, yyp, zcml, zig, zon, zs, zsh-theme]
    entitlements:
      path: App/QuickLookers.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        # Приложение тоже показывает WKWebView (живое превью темы во вкладке «Темы»).
        # WKWebView в песочнице поднимает вспомогательные процессы (WebContent/GPU/
        # Network) через защищённые соединения — без network.client они падают при
        # запуске (в логе RBS/Jetsam «process does not exist»), вебвью остаётся пустым.
        # Нужно и хосту, не только расширению, даже если HTML грузится из строки.
        com.apple.security.network.client: true
        # Security-scoped закладки на ~ и /Applications живут между запусками
        # (импорт темы и шрифта из установленного редактора). Без этого грант
        # powerbox действует только до выхода из приложения.
        com.apple.security.files.bookmarks.app-scope: true
        # Префикс Team ID (5FVC5YT2B5), а не «group.». macOS сверяет префикс с
        # подписью кода → доступ к контейнеру группы без профиля и без запроса
        # «доступ к данным других приложений». «group.»-идентификатор на
        # ненотаризованной сборке этот запрос вызывает на каждое обращение.
        com.apple.security.application-groups: [5FVC5YT2B5.com.quicklookers]
    dependencies:
      - target: QuickLookersPreview
        embed: true
      - package: QuickLookersEngine
        product: QuickLookersEngine
      - package: QuickLookersEngine
        product: QuickLookersSettingsKit
      - package: QuickLookersEngine
        product: QuickLookersImportKit
      - package: QuickLookersEngine
        product: QuickLookersEditorKit
      - package: QuickLookersEngine
        product: QuickLookersPreviewKit

  QuickLookersPreview:
    type: app-extension
    platform: macOS
    sources: [PreviewExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quicklookers.QuickLookers.PreviewExtension
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: PreviewExtension/QuickLookersPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # WKWebView в песочнице поднимает вспомогательные процессы (WebContent,
        # GPU, Network) через защищённые соединения. Без network.client они
        # падают при запуске — даже если HTML грузится из строки, без сети.
        com.apple.security.network.client: true
        # См. комментарий у хоста: Team-ID-префикс убирает запрос доступа.
        com.apple.security.application-groups: [5FVC5YT2B5.com.quicklookers]
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              # Невод «хвоста»: файлы, чей ТОЧНЫЙ листовой UTI — public.plain-text
              # (generic-текст, .txt, неизвестные текстовые расширения). csv/md сюда
              # НЕ попадают — у них собственные листовые UTI
              # (public.comma-separated-values-text / net.daringfireball.markdown),
              # а сопоставление идёт по точному листу. Незнакомое красится нейтральным
              # текстом (Слой B), csv/md остаются системе/соседу.
              - public.plain-text
              # Невод безрасширенных конфигов (Dockerfile, Makefile): их точный лист —
              # public.data (проверено URLResourceValues; тега на имя файла нет). Внутри
              # resolvePreview красит по имени (docker/make) или нейтралью; бинарь (не-UTF-8)
              # бросает → системный дженерик. Неизвестные РАСШИРЕНИЯ (dyn.*) сюда НЕ попадают.
              - public.data
              - public.python-script
              - com.netscape.javascript-source
              - org.nodejs.cjs
              - public.tsx
              - com.adobe.jsx
              - public.c-source
              - public.c-header
              - public.c-plus-plus-source
              - public.c-plus-plus-header
              - com.sun.java-source
              - org.go.source
              - org.rust-lang.rust
              - public.swift-source
              - com.microsoft.csharp-source
              - public.php-script
              - public.ruby-script
              - org.scala.source
              - public.perl-script
              - org.vuejs.vue
              - public.yaml
              - public.toml
              - public.json
              - org.iso.sql
              # Наш экспортируемый тип на свободные (dyn.*) расширения — см. UTExportedTypeDeclarations хоста.
              - com.quicklookers.source-code
            QLSupportsSearchableItems: false
    dependencies:
      - package: QuickLookersEngine
        product: QuickLookersEngine
      - package: QuickLookersEngine
        product: QuickLookersPreviewKit
      - package: QuickLookersEngine
        product: QuickLookersSettingsKit

  # Юнит-тесты чисто-логического кода App/ (без UI/AppKit-завязки):
  # FragmentCache, ImportModel.message(for:), MonospaceFonts.families,
  # CatalogLookup.themeId, BookmarkStore.AccessScope.* и т.п.
  # Хостится в QuickLookers, чтобы можно было `@testable import QuickLookers`.
  QuickLookersTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/AppTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quicklookers.QuickLookersTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: QuickLookers
