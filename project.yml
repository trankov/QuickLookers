name: QuickLookers
options:
  deploymentTarget:
    macOS: "13.0"
  bundleIdPrefix: com.quicklookers

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # Xcode 16+ собирает Debug через стуб-загрузчик (debug dylib). Для
    # app-расширения это ломает загрузку провайдера: бандл виден в настройках,
    # но QuickLook не может его поднять и откатывается к дефолту. Выключаем.
    ENABLE_DEBUG_DYLIB: NO
    # Впиши сюда свой Team ID (Xcode → Settings → Accounts → твой аккаунт → Team ID).
    # Для ручного запуска в Finder подпись обязательна; для xcodebuild-проверки
    # компиляции подпись отключается флагом в команде (CODE_SIGNING_ALLOWED=NO).
    DEVELOPMENT_TEAM: "5FVC5YT2B5"

packages:
  QuickLookersEngine:
    path: .

# Общая схема хоста: запуск (⌘R) поднимает приложение QuickLookers и
# регистрирует встроенное расширение Preview у демона pkd. Без явной схемы
# Xcode автосоздаёт их сам, и активной может оказаться схема расширения —
# тогда на ⌘R он спрашивает «Choose an App to run» (расширение само не
# запускается). Закрепляем здесь, чтобы переживало xcodegen generate.
schemes:
  QuickLookers:
    build:
      targets:
        QuickLookers: all
        QuickLookersTests: [test]
    run:
      config: Debug
      executable: QuickLookers
    test:
      config: Debug
      targets:
        - QuickLookersTests

targets:
  QuickLookers:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quicklookers.QuickLookers
        GENERATE_INFOPLIST_FILE: NO   # был YES; нужен явный Info.plist для UTExportedTypeDeclarations
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # libarchive приходит транзитивно от CLibArchive.systemLibrary (link "archive"
        # в module.modulemap). Явный флаг — страховка на случай, если линкер Xcode
        # не подхватит транзитивную зависимость.
        OTHER_LDFLAGS: -larchive
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Один экспортируемый тип на ВСЕ СВОБОДНЫЕ (dyn.*) расширения (652 шт., пользователь
        # подтвердил полный список). Лист свободного расширения становится нашим (Спайк E).
        # Язык внутри берётся по расширению из associations.json — один UTI на много языков
        # норм (это маршрутизация, не семантика). Список ГЕНЕРИТСЯ:
        # `swift Scripts/audit-extension-utis.swift --emit-tags` (снимок в
        # docs/.../2026-07-03-extension-uti-audit.md, категория 1b). Руками не редактировать.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.quicklookers.source-code
            UTTypeDescription: Source code (QuickLookers)
            UTTypeConformsTo: [public.source-code, public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [1p, 3pm, 4dform, 4dproject, 6pl, 6pm, _coffee, _emacs, _js, a51, abap, abbrev_defs, abnf, acl, ad, adl, adlf, adls, adlx, adml, admx, ado, adoc, adp, aes, agda, aheui, ahk, ahkl, aj, al, alg, als, ans, ant, apacheconf, apex, apl, apla, aplc, aplf, apli, apln, aplo, ara, arexx, art, asax, asc, asciidoc, ascx, asd, asdf, ashx, asm, asmx, asn1, aspx, astro, asy, at, au3, aug, auk, automount, aux, avsc, aw, awk, axaml, axd, axml, b, bal, bare, bas, bat, bats, bb, bbc, bbx, bc, bdy, be, beancount, befunge, bf, bib, bibtex, bicep, bicepparam, blade, blp, bmx, bnf, boa, bones, boo, boot, bpl, bqn, bro, bsl, bst, bug, builder, builds, bzl, cadl, cairo, cake, camkes, capnp, carbon, cask, cats, cbl, cblcpy, cblle, cblsrce, cbx, ccp, ccproj, ccxml, cdc, cddl, cdf, cdl, ceylon, cf, cfc, cfm, cfml, cgi, cginc, chai, chpl, ci, cirru, cjs, cjsx, cl2, clang-format, clar, clay, clixml, clj, cljc, cljs, cljscm, cljx, cls, cmake, cmd, cml, cnf, cob, cobcopy, cobol, code-snippets, code-workspace, coffee, comal, conf, copybook, coq, cpl, cppm, cproject, cps, cpsa, cpy, cql, cr, crmsh, croc, cry, cs, cscfg, csd, csdef, cshtml, csl, csproj, cssul4, csx, ct, ctp, cts, cu, cue, cuh, cw, cyp, cypher, d, darcspatch, dart, dasm, dasm16, dax, dcl, ddl, decls, def, depproj, desktop, device, dfm, dg, di, dita, ditamap, ditaval, djhtm, djhtml, dm, dme, dmesg, dml, do, docker, dockerfile, dof, doh, dotsettings, dpatch, dpk, dpp, dpr, dtd, dtsi, dtx, duby, duel, dump, dyalog, dyapp, dyl, dylan, e, ebnf, ebuild, ec, ecl, eclass, edge, edp, eex, eg, eh, el, elc, eld, eliom, eliomi, elm, elpi, emacs, env, envvars, erb, erl, es, es6, escript, evoque, ex, exec, exlib, explain, exw, eye, ezt, f03, f08, f18, factor, fan, fancypack, fastcgi_params, fc, fcgi, fd, feature, fhtml, fif, filters, fish, flo, flx, flxh, fmx, fnc, fnl, fnlm, fp, fpp, frg, frt, fshader, fsi, fsproj, fst, fsti, fsx, ftl, fun, func, fut, fx, fxh, fxml, fy, g, gap, gawk, gcode, gd, gdc, gdshader, gemspec, geo, gi, gjs, glade, gleam, glslf, glslv, gml, gmx, gnu, gnuplot, gnus, go, god, golo, googlesql, gql, gradle, graph, graphcool, graphql, graphqls, groovy, grt, grxml, gshader, gsp, gsql, gst, gsx, gtpl, gts, gv, gvy, gyp, gypi, hack, haml, handlebars, har, hbs, hcl, hdp, hhi, hic, hjson, hlean, hlsli, hrl, hs, hs-boot, hsail, hsc, hsig, hta, htaccess, htgroups, htmlul4, htpasswd, http, hx, hxml, hxsl, hy, hyb, hzp, i6t, i7x, ice, iced, icl, icn, icon, idc, idl, idl4, idr, ihlp, ijs, ik, imba, imba2, iml, inc, inf, ino, ins, instances, intr, io, ipf, isa, ivy, ixx, j, j2, jade, jag, jake, janet, jbst, jbuilder, jcl, jdn, jelly, jinja, jinja2, jison, jl, jp, jsb, jscad, jsfl, jsgf, jsh, jslib, jslt, jsm, json5, jsonc, jsonl, jsonld, jsonnet, jsp, jspre, jsproj, jss, jssm, jssm_state, jsul4, jsx, juttle, jy, k, kal, kid, kif, kk, kki, kml, kmsg, kn, kojo, kql, kt, ktm, kts, kusto, lagda, lasso, launch, lbx, lcry, ldif, lean, leex, lektorproject, less, lfm, lgt, lhs, libsonnet, lidr, linq, liquid, lisp, lks, lmi, load, logtalk, lpad, lpr, ls, lsl, lsp, ltx, lua, luau, ly, m2, ma, mac, makefile, man, mao, maql, marko, mask, mata, matah, mathematica, matlab, mawk, max, mc, mcfunction, mcmeta, mcschema, mdpolicy, mediawiki, mermaid, mipage, mips, mir, mjml, mkfile, mkii, mkiv, mkvi, ml, ml4, mli, mll, mly, mo, module, mojo, monkey, moo, moon, mount, move, mpl, mq4, mq5, mqh, ms, msc, mspec, mt, mu, mxml, mxx, mysql, myt, n, nas, natvis, nawk, nb, nbp, nc, ncl, ndproj, nf, ng2, nginx, nginxconf, ngx, ni, nim, nimble, nimrod, nims, nit, nix, njs, nl, nomad, nproj, nqp, ns2, nse, nsh, nsi, nt, nu, numba_ir, nuspec, ny, objdump, odd, odin, ooc, opa, orc, org, os, osm, p, p6, p6l, p6m, p8, pac, pack, pan, pascal, path, pc, pck, pcmk, pco, pcss, pd_lua, pddl, pdv, peg, perl, ph, php5, phps, phpt, pidl, pig, pike, pkb, pkgproj, pkh, pks, pl6, plb, plot, plsql, plt, pluginspec, plx, pm6, pml, pmod, po, podsl, podspec, polar, pom, pony, portugol, postcss, pov, pq, pqm, pr, praat, prawn, prc, prefs, prg, prisma, prm, pro, proc, proj, prolog, prom, promela, promql, properties, props, prql, ps1, ps1xml, psc, psc1, psd1, psgi, psi, psl, psm1, pt, ptls, ptx, pug, purs, pwn, pxi, py2tb, py3, py3tb, pyde, pye, pyi, pyp, pypylog, pyt, pytb, pyul4, pyw, pyx, q, qbs, qhelp, ql, qll, qml, query, qvs, qvto, qvw, r3, rabl, rake, raku, rakudoc, rakumod, rakutest, razor, rbi, rbuild, rbx, rbxs, rchit, rd, rdf, re, react, reb, red, reds, reek, reg, regex, regexp, rego, rei, rell, res, resource, rest, resx, rex, rexx, rhtml, ride, riscv, rita, rkt, rktd, rktl, rl, rmiss, rnc, robot, rockspec, ronn, rout, rpf, rpy, rq, rql, rs, rsl, rst, rsx, rts, ru, ruby, run, rviz, rvt, rx, sage, sarif, sarl, sas, sass, savi, sbl, sbt, sc, scad, scala, scaml, scb, scbl, scd, scdoc, sce, scgi_params, sch, sci, scm, sco, scope, scrbl, scss, scxml, sdbl, sed, sel, service, sexp, sfproj, sgf, sh-session, shader, shen, shex, shproj, sieve, sig, sil, siv, sjs, sl, sla, sld, slice, slim, sls, smali, smithy, sml, smv, snbt, snobol, socket, sol, sources, soy, sp, spacemacs, sparql, spc, spec, spice, spim, spl, splunk, sps, spt, sq, sqlcblle, src, srdf, ss, ssh_config, sshd_config, ssjs, ssp, st, stan, sthlp, story, sty, styl, stylus, sublime-build, sublime-color-scheme, sublime-commands, sublime-completions, sublime-keymap, sublime-macro, sublime-menu, sublime-mousemap, sublime-project, sublime-settings, sublime-snippet, sublime-syntax, sublime-theme, sublime-workspace, sublime_metrics, sublime_session, sv, svelte, svh, sw, swap, swg, syntax, t, tab, tac, tact, tal, talon, tap, target, targets, tasl, tasm, tcc, tcl, td, tea, teal, templ, tesc, tese, tex, tf, tfstate, tfvars, thor, thrift, thy, ti, tid, timer, tlb, tm, tml, tmpl, tmux, tnt, toc, todotxt, topojson, tpb, tpl, tpp, tps, treetop, trg, trigger, tsp, tst, tt, ttl, turtle, twig, txx, typ, typoscript, u, u1, u2, udf, udo, ui, ul4, urdf, uwsgi_params, ux, v, vala, vapi, vark, vb, vba, vbhtml, vbproj, vbs, vcl, vcxproj, veo, vh, vhd, vhdl, vhf, vhi, vho, vhost, vhs, vht, vhw, vim, vimrc, viper, vipgrm, viw, vm, vmb, vp, vpr, vrx, vshader, vsixmanifest, vssettings, vstemplate, vue, vv, vw, vxml, vy, wast, wat, watchr, wdiff, webapp, webidl, webmanifest, weechatlog, wgsl, whiley, wiki, wikitext, wixproj, wks, wl, wls, wlt, wlua, workbook, workflow, wren, wsdl, wsf, wsgi, wxi, wxl, wxs, x, x10, x3d, xacro, xaml, xbrl, xc, xdc, xi, xmi, xmlul4, xpl, xpp, xproj, xpy, xq, xql, xqm, xquery, xqy, xrl, xsd, xsjs, xsjslib, xsl, xslt, xspec, xtend, xtm, xul, yang, yap, yar, yasm, yrl, yyp, zcml, zeek, zep, zig, zon, zone, zs, zsh-theme]
    entitlements:
      path: App/QuickLookers.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        # Приложение тоже показывает WKWebView (живое превью темы во вкладке «Темы»).
        # WKWebView в песочнице поднимает вспомогательные процессы (WebContent/GPU/
        # Network) через защищённые соединения — без network.client они падают при
        # запуске (в логе RBS/Jetsam «process does not exist»), вебвью остаётся пустым.
        # Нужно и хосту, не только расширению, даже если HTML грузится из строки.
        com.apple.security.network.client: true
        # Security-scoped закладки на ~ и /Applications живут между запусками
        # (импорт темы и шрифта из установленного редактора). Без этого грант
        # powerbox действует только до выхода из приложения.
        com.apple.security.files.bookmarks.app-scope: true
        # Префикс Team ID (5FVC5YT2B5), а не «group.». macOS сверяет префикс с
        # подписью кода → доступ к контейнеру группы без профиля и без запроса
        # «доступ к данным других приложений». «group.»-идентификатор на
        # ненотаризованной сборке этот запрос вызывает на каждое обращение.
        com.apple.security.application-groups: [5FVC5YT2B5.com.quicklookers]
    dependencies:
      - target: QuickLookersPreview
        embed: true
      - package: QuickLookersEngine
        product: QuickLookersEngine
      - package: QuickLookersEngine
        product: QuickLookersSettingsKit
      - package: QuickLookersEngine
        product: QuickLookersImportKit
      - package: QuickLookersEngine
        product: QuickLookersEditorKit
      - package: QuickLookersEngine
        product: QuickLookersPreviewKit

  QuickLookersPreview:
    type: app-extension
    platform: macOS
    sources: [PreviewExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quicklookers.QuickLookers.PreviewExtension
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: PreviewExtension/QuickLookersPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # WKWebView в песочнице поднимает вспомогательные процессы (WebContent,
        # GPU, Network) через защищённые соединения. Без network.client они
        # падают при запуске — даже если HTML грузится из строки, без сети.
        com.apple.security.network.client: true
        # См. комментарий у хоста: Team-ID-префикс убирает запрос доступа.
        com.apple.security.application-groups: [5FVC5YT2B5.com.quicklookers]
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              # Невод «хвоста»: файлы, чей ТОЧНЫЙ листовой UTI — public.plain-text
              # (generic-текст, .txt, неизвестные текстовые расширения). csv/md сюда
              # НЕ попадают — у них собственные листовые UTI
              # (public.comma-separated-values-text / net.daringfireball.markdown),
              # а сопоставление идёт по точному листу. Незнакомое красится нейтральным
              # текстом (Слой B), csv/md остаются системе/соседу.
              - public.plain-text
              # Невод безрасширенных конфигов (Dockerfile, Makefile): их точный лист —
              # public.data (проверено URLResourceValues; тега на имя файла нет). Внутри
              # resolvePreview красит по имени (docker/make) или нейтралью; бинарь (не-UTF-8)
              # бросает → системный дженерик. Неизвестные РАСШИРЕНИЯ (dyn.*) сюда НЕ попадают.
              - public.data
              - public.python-script
              - com.netscape.javascript-source
              - org.nodejs.cjs
              - public.tsx
              - com.adobe.jsx
              - public.c-source
              - public.c-header
              - public.c-plus-plus-source
              - public.c-plus-plus-header
              - com.sun.java-source
              - org.go.source
              - org.rust-lang.rust
              - public.swift-source
              - com.microsoft.csharp-source
              - public.php-script
              - public.ruby-script
              - org.scala.source
              - public.perl-script
              - org.vuejs.vue
              - public.yaml
              - public.toml
              - public.json
              - org.iso.sql
              # Наш экспортируемый тип на свободные (dyn.*) расширения — см. UTExportedTypeDeclarations хоста.
              - com.quicklookers.source-code
              # Выверенные системные UTI (категория 1a аудита): тип = код/текст, объявление —
              # чистый выигрыш; язык берётся по расширению в resolvePreview. Точный лист мы
              # перехватываем (Спайк B: побеждаем систему). Список выверен вручную —
              # docs/.../2026-07-03-extension-uti-audit.md. НЕ добавлять «ложных друзей»
              # (реальный не-код): .app/.pf/.dds/.gp/.pot(x)/.sdc/.mts/.mod/.pls/.url/.exs/
              # .scpt/.storyboard/.xib, а также семантические расхождения (.l/.yy/.i/.cl) и
              # вне-области (markdown/csv).
              - public.ada-source                       # .ada/.adb/.ads → ada
              - com.apple.applescript.text              # .applescript → applescript (НЕ .scpt — бинарь)
              - public.bash-script                      # .bash → shellscript
              - public.ksh-script                       # .ksh → shellscript
              - public.zsh-script                       # .zsh → shellscript
              - public.shell-script                     # .sh → shellscript
              - com.apple.terminal.shell-script         # .command/.tool → shellscript
              - public.csh-script                       # .csh → shellscript (Pygments-хвост)
              - public.tcsh-script                      # .tcsh → shellscript (Pygments-хвост)
              - public.ndjson                           # .ndjson → json (Pygments-хвост)
              - public.css                              # .css → css
              - public.html                             # .html/.htm → html
              - public.xhtml                            # .xhtml/.xht → html
              - public.xml                              # .xml → xml
              - public.patch-file                       # .diff/.patch → diff
              - public.fortran-source                   # .f/.for → fortran
              - public.fortran-77-source                # .f77 → fortran
              - public.fortran-90-source                # .f90 → fortran
              - public.fortran-95-source                # .f95 → fortran
              - public.pascal-source                    # .pas → pascal
              - public.objective-c-source               # .m → objective-c
              - public.objective-c-plus-plus-source     # .mm → objective-cpp
              - public.assembly-source                  # .s → asm
              - public.nasm-assembly-source             # .nasm → asm
              - public.protobuf-source                  # .proto → proto
              - public.make-source                      # Makefile/.mak/.make/.mk → make (лист Makefile = public.make-source, не public.data)
              - com.microsoft.ini                       # .ini → ini (конфиг-текст)
              - com.microsoft.hlsl                      # .hlsl → hlsl
              - org.khronos.glsl-source                 # .glsl → glsl
              - org.khronos.glsl.fragment-shader        # .frag/.fsh (и .fs=fsharp — по расширению)
              - org.khronos.glsl.vertex-shader          # .vert/.vsh (и .vs)
              - org.khronos.glsl.geometry-shader        # .geom/.gsh (и .gs=genie)
              - com.microsoft.typescript                # .tsx → tsx (public.tsx лист может не совпадать)
              # Три намеренных перехвата «ложных друзей» (подтверждено пользователем):
              # редкие настоящие .ts-видео/.r-Rez/.as-AppleSingle-архив деградируют до
              # дженерика — принято (AppleSingle — вымерший формат; бинарь не-UTF-8 → дженерик).
              # ОГОВОРКА (живая проверка): если установлен VLC, у него свой QL-провайдер
              # на public.mpeg-2-transport-stream, и система предпочитает ЕГО нашему —
              # .ts тогда показывает VLC, не код (конфликт ПРОВАЙДЕРОВ, не типов;
              # решается галочкой в «Системные настройки → Быстрый просмотр»). На машине
              # без такого провайдера .ts достаётся нам. .r перехват подтверждён вживую.
              - public.mpeg-2-transport-stream          # .ts → typescript (может перебить VLC)
              - com.apple.rez-source                    # .r  → r
              - com.apple.applesingle-archive           # .as → actionscript-3
            QLSupportsSearchableItems: false
    dependencies:
      - package: QuickLookersEngine
        product: QuickLookersEngine
      - package: QuickLookersEngine
        product: QuickLookersPreviewKit
      - package: QuickLookersEngine
        product: QuickLookersSettingsKit

  # Юнит-тесты чисто-логического кода App/ (без UI/AppKit-завязки):
  # FragmentCache, ImportModel.message(for:), MonospaceFonts.families,
  # CatalogLookup.themeId, BookmarkStore.AccessScope.* и т.п.
  # Хостится в QuickLookers, чтобы можно было `@testable import QuickLookers`.
  QuickLookersTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/AppTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quicklookers.QuickLookersTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: QuickLookers
