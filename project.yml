name: QuickLookers
options:
  deploymentTarget:
    macOS: "13.0"
  bundleIdPrefix: com.quicklookers

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # Xcode 16+ собирает Debug через стуб-загрузчик (debug dylib). Для
    # app-расширения это ломает загрузку провайдера: бандл виден в настройках,
    # но QuickLook не может его поднять и откатывается к дефолту. Выключаем.
    ENABLE_DEBUG_DYLIB: NO
    # Впиши сюда свой Team ID (Xcode → Settings → Accounts → твой аккаунт → Team ID).
    # Для ручного запуска в Finder подпись обязательна; для xcodebuild-проверки
    # компиляции подпись отключается флагом в команде (CODE_SIGNING_ALLOWED=NO).
    DEVELOPMENT_TEAM: "5FVC5YT2B5"

packages:
  QuickLookersEngine:
    path: .

# Общая схема хоста: запуск (⌘R) поднимает приложение QuickLookers и
# регистрирует встроенное расширение Preview у демона pkd. Без явной схемы
# Xcode автосоздаёт их сам, и активной может оказаться схема расширения —
# тогда на ⌘R он спрашивает «Choose an App to run» (расширение само не
# запускается). Закрепляем здесь, чтобы переживало xcodegen generate.
schemes:
  QuickLookers:
    build:
      targets:
        QuickLookers: all
    run:
      config: Debug
      executable: QuickLookers

targets:
  QuickLookers:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quicklookers.QuickLookers
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # libarchive приходит транзитивно от CLibArchive.systemLibrary (link "archive"
        # в module.modulemap). Явный флаг — страховка на случай, если линкер Xcode
        # не подхватит транзитивную зависимость.
        OTHER_LDFLAGS: -larchive
    entitlements:
      path: App/QuickLookers.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        # Префикс Team ID (5FVC5YT2B5), а не «group.». macOS сверяет префикс с
        # подписью кода → доступ к контейнеру группы без профиля и без запроса
        # «доступ к данным других приложений». «group.»-идентификатор на
        # ненотаризованной сборке этот запрос вызывает на каждое обращение.
        com.apple.security.application-groups: [5FVC5YT2B5.com.quicklookers]
    dependencies:
      - target: QuickLookersPreview
        embed: true
      - package: QuickLookersEngine
        product: QuickLookersEngine
      - package: QuickLookersEngine
        product: QuickLookersSettingsKit
      - package: QuickLookersEngine
        product: QuickLookersImportKit

  QuickLookersPreview:
    type: app-extension
    platform: macOS
    sources: [PreviewExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quicklookers.QuickLookers.PreviewExtension
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: PreviewExtension/QuickLookersPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # WKWebView в песочнице поднимает вспомогательные процессы (WebContent,
        # GPU, Network) через защищённые соединения. Без network.client они
        # падают при запуске — даже если HTML грузится из строки, без сети.
        com.apple.security.network.client: true
        # См. комментарий у хоста: Team-ID-префикс убирает запрос доступа.
        com.apple.security.application-groups: [5FVC5YT2B5.com.quicklookers]
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - public.python-script
              - com.netscape.javascript-source
              - org.nodejs.cjs
              - public.tsx
              - com.adobe.jsx
              - public.c-source
              - public.c-header
              - public.c-plus-plus-source
              - public.c-plus-plus-header
              - com.sun.java-source
              - org.go.source
              - org.rust-lang.rust
              - public.swift-source
              - com.microsoft.csharp-source
              - public.php-script
              - public.ruby-script
              - org.scala.source
              - public.perl-script
              - org.vuejs.vue
              - public.yaml
              - public.toml
              - public.json
              - org.iso.sql
            QLSupportsSearchableItems: false
    dependencies:
      - package: QuickLookersEngine
        product: QuickLookersEngine
      - package: QuickLookersEngine
        product: QuickLookersPreviewKit
      - package: QuickLookersEngine
        product: QuickLookersSettingsKit
